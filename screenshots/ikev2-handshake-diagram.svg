<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#081021" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101e3f" />
      <stop offset="100%" stop-color="#081022" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">RFC 7296 IKEv2 Cryptographic Handshake &amp; NAT-T Lifecycle</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Two-Exchange Negotiation, Key Derivation, UDP 4500 Auto-Floating, and IPsec ESP Child SA</text>

  <!-- Peer Column Headers -->
  <rect x="80" y="95" width="300" height="65" rx="8" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="1.5" />
  <text x="230" y="122" fill="#22d3ee" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Initiator Gateway (Local)</text>
  <text x="230" y="142" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">IP: 198.51.100.10 | SPI_i: a1b2c3d4...</text>

  <rect x="620" y="95" width="300" height="65" rx="8" fill="url(#nodeGrad)" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="122" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Responder Gateway (Cloud/Peer)</text>
  <text x="770" y="142" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">IP: 203.0.113.1 | SPI_r: f8e7d6c5...</text>

  <!-- Vertical Timelines -->
  <line x1="230" y1="160" x2="230" y2="610" stroke="#16264d" stroke-width="2" stroke-dasharray="4" />
  <line x1="770" y1="160" x2="770" y2="610" stroke="#16264d" stroke-width="2" stroke-dasharray="4" />

  <!-- Exchange 1: IKE_SA_INIT Request -->
  <line x1="230" y1="200" x2="760" y2="200" stroke="#06b6d4" stroke-width="2" />
  <polygon points="760,195 770,200 760,205" fill="#06b6d4" />
  <rect x="290" y="180" width="420" height="35" rx="5" fill="#040917" stroke="#06b6d4" />
  <text x="500" y="196" fill="#22d3ee" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">1. IKE_SA_INIT Request [UDP 500]</text>
  <text x="500" y="210" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">HDR(SPI_i, 0), SAi1(AES-GCM, SHA-384, DH19), KEi, Ni, NAT_DETECTION</text>

  <!-- Exchange 1: IKE_SA_INIT Response -->
  <line x1="770" y1="260" x2="240" y2="260" stroke="#3b82f6" stroke-width="2" />
  <polygon points="240,255 230,260 240,265" fill="#3b82f6" />
  <rect x="290" y="240" width="420" height="35" rx="5" fill="#040917" stroke="#3b82f6" />
  <text x="500" y="256" fill="#60a5fa" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">2. IKE_SA_INIT Response [UDP 500]</text>
  <text x="500" y="270" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">HDR(SPI_i, SPI_r), SAr1(Chosen), KEr, Nr, NAT_DETECTION</text>

  <!-- Cryptographic Derivation Box -->
  <rect x="270" y="300" width="460" height="48" rx="6" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" />
  <text x="500" y="320" fill="#c4b5fd" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Cryptographic Key Derivation &amp; NAT-T Evaluation</text>
  <text x="500" y="338" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">SKEYSEED = prf(Ni | Nr, g^ir) -&gt; SK_d, SK_ai, SK_ar, SK_ei, SK_er</text>

  <!-- Exchange 2: IKE_AUTH Request (Floated to UDP 4500) -->
  <line x1="230" y1="385" x2="760" y2="385" stroke="#f59e0b" stroke-width="2" />
  <polygon points="760,380 770,385 760,390" fill="#f59e0b" />
  <rect x="270" y="365" width="460" height="40" rx="5" fill="#040917" stroke="#f59e0b" />
  <text x="500" y="382" fill="#fbbf24" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">3. IKE_AUTH Request [Floated to UDP 4500 (Non-ESP Marker)]</text>
  <text x="500" y="397" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">HDR, SK{ IDi, AUTH(PSK), SAi2(Child ESP), TSi(0.0.0.0/0), TSr(0.0.0.0/0) }</text>

  <!-- Exchange 2: IKE_AUTH Response -->
  <line x1="770" y1="445" x2="240" y2="445" stroke="#10b981" stroke-width="2" />
  <polygon points="240,440 230,445 240,450" fill="#10b981" />
  <rect x="270" y="425" width="460" height="40" rx="5" fill="#040917" stroke="#10b981" />
  <text x="500" y="442" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">4. IKE_AUTH Response [UDP 4500]</text>
  <text x="500" y="457" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">HDR, SK{ IDr, AUTH(PSK), SAr2(Child ESP SAs), TSi, TSr }</text>

  <!-- Established IPsec ESP Tunnel -->
  <rect x="180" y="505" width="640" height="85" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2" />
  <text x="500" y="530" fill="#34d399" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">✓ CHILD SA ESTABLISHED — LINE-RATE ENCRYPTED IPsec ESP</text>
  <text x="500" y="550" fill="#f8fafc" font-family="monospace" font-size="11" text-anchor="middle">IPsec ESP (Protocol 50 or UDP 4500) | AES-256-GCM AEAD | 64-bit Anti-Replay</text>
  <text x="500" y="570" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">DPD 10s Health Heartbeats | PFS Enabled (Group 19 Rekey) | MTU 1400 / MSS 1360 Clamped</text>

  <!-- Bottom Explanatory Bar -->
  <rect x="80" y="615" width="840" height="40" rx="6" fill="#040917" stroke="#16264d" />
  <text x="500" y="640" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Zero-Trust Security: 3DES, MD5, SHA-1, and DH Groups &lt; 14 are strictly blocked to eliminate Sweet32 &amp; Logjam attacks.</text>
</svg>
